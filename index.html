<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Primície 2026</title>

  <!-- Prepojenie CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>Primície 2026</h1>
  <div id="countdown"></div>
</header>

<section class="rsvp">
  <h2>Potvrdenie účasti</h2>
  <button class="primary-btn" id="openForm">Potvrdiť účasť</button>
</section>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>Potvrdenie účasti</h3>

    <form action="https://formspree.io/f/XXXXXXXX" method="POST">
      <input type="text" name="meno" placeholder="Meno" required>
      <input type="text" name="priezvisko" placeholder="Priezvisko" required>
      <input type="number" name="pocet" placeholder="Počet osôb" min="1" required>
      <input type="email" name="email" placeholder="E-mail" required>
      <button type="submit" class="primary-btn">Odoslať</button>
    </form>
  </div>
</div>

<section class="events">
  <div class="event-box">
    <h3>Vysviacka</h3>
    <p><strong>12. 6. 2026 o 10:00</strong><br>Dóm sv. Alžbety, Košice</p>

    <iframe src="https://www.google.com/maps?q=Dóm sv. Alžbety Košice&output=embed"></iframe>

    <a class="calendar" href="https://www.google.com/calendar/render?action=TEMPLATE&text=Kňazská vysviacka&dates=20260612T080000Z/20260612T100000Z&location=Dóm sv. Alžbety Košice" target="_blank">
      Pridať do Google kalendára
    </a>
  </div>

  <div class="event-box">
    <h3>Primície</h3>
    <p><strong>13. 6. 2026 o 10:30</strong><br>Rím. kat. kostol, Stuľany</p>

    <iframe src="https://www.google.com/maps?q=Rímskokatolícky kostol Stuľany&output=embed"></iframe>

    <a class="calendar" href="https://www.google.com/calendar/render?action=TEMPLATE&text=Primície&dates=20260613T083000Z/20260613T103000Z&location=Stuľany" target="_blank">
      Pridať do Google kalendára
    </a>
  </div>
</section>

<section class="food">
  <h2>Pohostenie</h2>
  <p><strong>13. 6. po sv. omši</strong><br>Kultúrny dom Stuľany</p>

  <iframe src="https://www.google.com/maps?q=Kultúrny dom Stuľany&output=embed"></iframe>
</section>

<script src="script.js"></script>
</body>
</html>
